  <script>
    const tl = gsap.timeline({ paused: true })
    const count = (sel, to, at, dur) => {
      const el = document.querySelector(sel)
      const proxy = { v: 0 }
      tl.fromTo(
        proxy,
        { v: 0 },
        {
          v: to,
          duration: dur,
          ease: "power2.out",
          onUpdate: () => {
            el.firstChild.nodeValue = proxy.v < 0.5 ? "–" : String(Math.round(proxy.v))
          },
        },
        at,
      )
    }
    const draw = (sel, at) => {
      const p = document.querySelector(sel)
      const len = Math.ceil(p.getTotalLength()) + 2
      tl.fromTo(p, { strokeDasharray: len, strokeDashoffset: len }, { strokeDashoffset: 0, duration: 0.7, ease: "power2.inOut" }, at)
    }

    // Background plane drifts slowest
    tl.fromTo("#film-bg", { scale: 1.18, y: 40 }, { scale: 1, y: 0, duration: 6.2, ease: "power2.inOut" }, 0)

    // Act A (0–3.0): close-up on one subject; its grade counts up.
    tl.fromTo("#film-cam", { scale: 2.2, x: 492.8, y: 580.8 }, { scale: 2.2, x: 492.8, y: 580.8, duration: 0.01 }, 0)
    tl.fromTo("#c-ll", { opacity: 0.3, filter: "blur(10px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.9, ease: "power3.out" }, 0.35)
    tl.fromTo(["#b-ll", "#t-ll", "#f-ll"], { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.18, stagger: 0.12, ease: "power4.out" }, 2.1)
    count("#g-ll", 6, 1.05, 1.15)
    draw("#s-ll", 1.5)

    // Act B (3.0–5.8): camera pulls back; the rest of the year lands around it.
    tl.to("#film-cam", { scale: 1, x: 0, y: 0, duration: 1.6, ease: "power2.inOut" }, 3.0)
    tl.fromTo(
      ["#c-fr", "#c-is", "#c-sc", "#c-ma", "#c-de"],
      { opacity: 0, scale: 0.94, y: 24, filter: "blur(8px)" },
      { opacity: 1, scale: 1, y: 0, filter: "blur(0px)", duration: 0.65, stagger: 0.08, ease: "expo.out" },
      3.35,
    )
    count("#g-fr", 5, 3.6, 0.8)
    count("#g-is", 5, 3.68, 0.8)
    count("#g-sc", 6, 3.76, 0.8)
    count("#g-ma", 5, 3.84, 0.8)
    count("#g-de", 5, 3.92, 0.8)
    ;["#s-fr", "#s-is", "#s-sc", "#s-ma", "#s-de"].forEach((s, i) => draw(s, 3.75 + i * 0.08))

    // Foreground chips: enter later and travel further than the cards (parallax depth)
    tl.fromTo("#ch-up", { opacity: 0, y: 70, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.6, ease: "expo.out" }, 3.9)
    tl.fromTo("#ch-target", { opacity: 0, y: 90, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.6, ease: "expo.out" }, 4.05)
    tl.fromTo("#ch-sync", { opacity: 0, y: 90, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.6, ease: "expo.out" }, 4.2)
    tl.to("#film-fg", { y: -60, duration: 2.0, ease: "none" }, 3.9)

    // Act C (5.7–6.8): every card is carried into the Average grade tile of the real mobile dashboard as it builds around them.
    tl.to(["#ch-up", "#ch-target", "#ch-sync"], { opacity: 0, filter: "blur(8px)", duration: 0.22, stagger: 0.04, ease: "power3.in" }, 5.7)
    const rows = { "#c-ll": 617, "#c-fr": 617, "#c-is": 617, "#c-sc": 617, "#c-ma": 617, "#c-de": 617 }
    const centers = { "#c-ll": [316, 696], "#c-fr": [764, 696], "#c-is": [316, 960], "#c-sc": [764, 960], "#c-ma": [316, 1224], "#c-de": [764, 1224] }
    Object.entries(rows).forEach(([sel, rowY], i) => {
      const [cx, cy] = centers[sel]
      tl.to(sel, { x: 398 - cx, y: rowY - cy, scale: 0.07, opacity: 0, filter: "blur(4px)", duration: 0.7, ease: "power3.in" }, 5.8 + i * 0.04)
    })
    tl.fromTo("#film-frame", { opacity: 0, scale: 1.06, filter: "blur(10px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.85, ease: "power3.out" }, 5.95)
    // 6.8–9.5: the product holds dead still for the tagline that sits over it.
    tl.set({}, {}, 9.5)

    window.__timelines["film"] = tl
  </script>
